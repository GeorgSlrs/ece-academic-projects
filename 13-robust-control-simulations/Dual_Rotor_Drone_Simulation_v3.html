<!-- ===============================================================
     Dual-Rotor Drone – Fixed-PID Robust-Control Demo
     ---------------------------------------------------------------
     • “Box at (0,0)”   : visual target the craft must settle on
     • Spinning rotors  : black disks that rotate with thrust
     • PID gains        : hard-coded from MATLAB script
     • Drag coefficients: user-adjustable b_x, b_y  (N·s m⁻¹)
     • Integration      : simple Forward-Euler (see NOTE if you
                          want to swap in RK-4 for higher accuracy)
     =============================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dual-Rotor Drone – Robust-Control Demo</title>

<!-- ==========  EMBEDDED CSS  ===================================== -->
<style>
  /* Light background so red thrust arrows stand out */
  body{
    margin:0; font-family:monospace; background:#eef1ff;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{margin:0.8rem;font-size:1.5rem}
  /* Canvas holds the world; we draw everything in pixels */
  canvas{border:2px solid #132; background:#eef1ff}
  /* Simple card for live telemetry */
  #readout{
    white-space:pre; background:#fff; padding:0.5rem; border-radius:4px;
    box-shadow:0 2px 5px rgba(0,0,0,.2); margin:0.5rem
  }
  /* Flex row for buttons + sliders */
  #controls{display:flex; flex-wrap:wrap; gap:0.6rem; margin-bottom:0.6rem}
  label{font-size:0.9rem}
  input,button{font-family:inherit; font-size:0.9rem}
  button{
    padding:0.4rem 0.8rem; border:none; border-radius:4px;
    background:#3367d6; color:#fff; cursor:pointer
  }
  button:active{transform:scale(.96)}
</style>
</head>

<body>
<h1>Dual-Rotor Drone – Robust-Control Demo</h1>

<!-- 2-D drawing surface -->
<canvas id="canvas" width="900" height="460"></canvas>

<!-- Scrolling text read-out -->
<pre id="readout"></pre>

<!-- ------------  UI widgets  ----------------- -->
<div id="controls">
  <button id="btnStart">Start</button>
  <button id="btnReset">Reset</button>

  <!--   Linear drag coefficients (air-resistance)   -->
  <label>b<sub>x</sub> (N·s/m):
    <input id="bxInput" type="number" value="0" step="0.05">
  </label>
  <label>b<sub>y</sub> (N·s/m):
    <input id="byInput" type="number" value="0" step="0.05">
  </label>

  <!--   Sensor noise & external disturbance sliders  -->
  <label>Noise σ:
    <input id="noiseSlider" type="range" min="0" max="0.1" step="0.005" value="0.01">
  </label>
  <label>Disturbance:
    <input id="distSlider" type="range" min="0" max="1" step="0.05" value="0.2">
  </label>
</div>

<!-- ==========  JAVASCRIPT SECTION  =============================== -->
<script>
/* ---------------- 1. CONSTANTS & GAINS ---------------------------
   The gains come straight from your MATLAB script.
   They are “rate-mode” P- and D-gains (all Ki = 0).
-------------------------------------------------------------------*/
const m = 1.0;           // mass  (kg)
const I = 0.1;           // pitch moment of inertia  (kg·m²)
const l = 0.1;           // half-arm length           (m)
const g = 9.81;          // gravity                  (m/s²)

const gains = {
  y : {Kp:15, Ki:0, Kd:10},    // altitude loop
  t : {Kp:15, Ki:0, Kd:7.5},   // pitch loop
  x : {Kp:0.8,Ki:0, Kd:1.5}    // horizontal loop
};

const dt = 0.02;               // integration step (50 Hz)

/* ---------------- 2.  STATE & UI-driven params ------------------ */
let s = {x:0, y:0, th:0, dx:0, dy:0, dth:0};   // 6-state vector
let intY=0, intT=0, intX=0, thetaRef=0;        // integrators

let noiseStd  = parseFloat(noiseSlider.value); // sensor noise σ
let distAmp   = parseFloat(distSlider.value);  // disturbance gain
let bx        = parseFloat(bxInput.value);     // drag x-axis
let by        = parseFloat(byInput.value);     // drag y-axis

/* Fast Gaussian RNG (Box–Muller) --------------------------------- */
function randn(){
  const u1=Math.random(), u2=Math.random();
  return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
}

/* ---------------- 3.  FIXED-PID CONTROLLER ----------------------
   Cascade structure:
     outer x-loop computes θ_ref
     inner θ-loop + y-loop compute ΔM and ΔT
-------------------------------------------------------------------*/
function controller(){
  /* live-update drag from UI */
  bx = parseFloat(bxInput.value);
  by = parseFloat(byInput.value);

  /* noisy measurements */
  const xM  = s.x  + noiseStd*randn();
  const yM  = s.y  + noiseStd*randn();
  const thM = s.th + noiseStd*randn();

  /* errors, derivatives */
  const eX = -xM,    dX = -s.dx;
  const eY = -yM,    dY = -s.dy;

  /* integrate (Ki = 0 so integrators keep zero) */
  intX += eX*dt;  intY += eY*dt;

  /* --- x-loop produces a desired pitch θ_ref --- */
  thetaRef = gains.x.Kp*eX + gains.x.Kd*dX;

  /* limit pitch reference to ±10 deg for safety */
  const maxPitch = 10*Math.PI/180;
  thetaRef = Math.max(-maxPitch, Math.min(maxPitch, thetaRef));

  /* --- θ-loop drives actual θ to θ_ref --- */
  const eT = thetaRef - thM;
  const dT = -s.dth;
  intT += eT*dt;

  const dM = gains.t.Kp*eT + gains.t.Kd*dT;          // ΔM (N·m)

  /* --- y-loop controls total thrust --- */
  const dTtot = gains.y.Kp*eY + gains.y.Kd*dY;        // ΔT (N)

  /* map moment & total thrust → individual rotor forces */
  let uSum  = m*g + dTtot;        // baseline mg + correction
  let uDiff = dM / l;             // algebraic inversion
  let u1 = (uSum - uDiff)/2;
  let u2 = (uSum + uDiff)/2;

  /* actuator saturation (0–20 N) */
  u1 = Math.max(0, Math.min(20, u1));
  u2 = Math.max(0, Math.min(20, u2));

  return {u1, u2};
}

/* ---------------- 4. NON-LINEAR PLANT + DRAG --------------------
   m ẍ = −(u₁+u₂) sinθ − bₓ ẋ
   m ÿ =  (u₁+u₂) cosθ − m g − bᵧ ẏ
   I θ̈ =  l(u₂−u₁) + disturbance
-------------------------------------------------------------------*/
function step(u){
  const T  = u.u1 + u.u2;
  const Mz = l*(u.u2 - u.u1);

  /* translational accelerations with linear drag */
  const ddx  = -(T*Math.sin(s.th))/m - bx*s.dx/m;
  const ddy  =  (T*Math.cos(s.th))/m - g - by*s.dy/m;

  /* rotational acceleration with white-noise torque */
  const ddth =  Mz/I + distAmp*randn();

  /* Forward-Euler update (NOTE: swap to RK-4 if you need
     higher accuracy—see README comment at top of file) */
  s.dx  += ddx*dt;   s.x  += s.dx*dt;
  s.dy  += ddy*dt;   s.y  += s.dy*dt;
  s.dth += ddth*dt;  s.th += s.dth*dt;
}

/* ---------------- 5. DRAW ROUTINE --------------------------------
   Converts world metres → canvas pixels, draws:
     • target box at (0,0)
     • body bar
     • two spinning rotors (black disks)
     • thrust arrows
     • live telemetry text
-------------------------------------------------------------------*/
const cvs = document.getElementById('canvas'), ctx=cvs.getContext('2d');
const PX_PER_M = 120;
function py(m){return cvs.height/2 - m*PX_PER_M;}

function draw(u){
  ctx.clearRect(0,0,cvs.width,cvs.height);

  /* (0,0) world target */
  const tx=cvs.width/2, ty=py(0);
  ctx.fillStyle="#b2ffb2"; ctx.fillRect(tx-25,ty-12,50,24);

  /* body bar */
  const cx=cvs.width/2 + s.x*PX_PER_M, cy=py(s.y);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(s.th);
  ctx.fillStyle="#222"; ctx.fillRect(-30,-5,60,10);
  ctx.restore();

  /* rotor disks (visual spin speed ≈ thrust) */
  const rotor=(sgn,f)=>{
    ctx.save();
    ctx.translate(cx+sgn*25*Math.cos(s.th), cy+sgn*25*Math.sin(s.th));
    ctx.rotate(f*40%6.283);        // arbitrary scaling for effect
    ctx.fillStyle="#000"; ctx.beginPath();
    ctx.arc(0,0,8,0,2*Math.PI); ctx.fill();
    ctx.restore();
  };
  rotor(-1,u.u1); rotor(+1,u.u2);

  /* red thrust arrows */
  ctx.strokeStyle="red"; ctx.lineWidth=2;
  [-1,1].forEach((sgn,i)=>{
    const f=i?u.u2:u.u1;             // choose u₁ or u₂
    ctx.beginPath();
    ctx.moveTo(cx+sgn*15*Math.cos(s.th), cy+sgn*15*Math.sin(s.th));
    ctx.lineTo(cx+sgn*15*Math.cos(s.th)-f*3*Math.sin(s.th),
               cy+sgn*15*Math.sin(s.th)+f*3*Math.cos(s.th));
    ctx.stroke();
  });

  /* telemetry block */
  readout.textContent =
`x (m)      : ${s.x.toFixed(2)}
y (m)      : ${s.y.toFixed(2)}
θ (deg)    : ${(s.th*180/Math.PI).toFixed(1)}
ẋ (m/s)   : ${s.dx.toFixed(2)}
ẏ (m/s)   : ${s.dy.toFixed(2)}
θ̇ (deg/s) : ${(s.dth*180/Math.PI).toFixed(1)}
u₁,u₂ (N)  : ${u.u1.toFixed(1)} , ${u.u2.toFixed(1)}
bₓ,bᵧ      : ${bx.toFixed(2)} , ${by.toFixed(2)}
θ_ref (deg): ${(thetaRef*180/Math.PI).toFixed(1)}`;
}

/* ---------------- 6. MAIN LOOP ---------------------------------- */
let running=false;
function loop(){
  if(running){
    const u=controller();
    step(u);
    draw(u);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------- 7. UI HOOKS ----------------------------------- */
btnStart.onclick = () => {
  running = !running;
  btnStart.textContent = running ? 'Pause' : 'Start';
};
btnReset.onclick = () => {
  s={x:0,y:0,th:0,dx:0,dy:0,dth:0};
  intX=intY=intT=thetaRef=0;
  running=false; btnStart.textContent='Start';
  draw({u1:0,u2:0});
};
/* sliders update global vars in real time */
noiseSlider.oninput = e => noiseStd = parseFloat(e.target.value);
distSlider.oninput  = e => distAmp = parseFloat(e.target.value);

/* first static frame */
draw({u1:0,u2:0});
</script>
</body>
</html>
